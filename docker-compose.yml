
services:
  movie:
    build: ./movie/
    ports:
      - "3001:3001"
    environment:
      MONGO_URI: mongodb://root:example@mongo:27017/
      MONGO_DB: movies_db
    depends_on:
      - mongo

  booking:
    build: ./booking/
    ports:
      - "3003:3003"
    environment:
      MONGO_URI: mongodb://root:example@mongo:27017/
      MONGO_DB: bookings_db
    depends_on:
      - mongo

  schedule:
    build: ./schedule/
    ports:
      - "3002:3002"
    environment:
      MONGO_URI: mongodb://root:example@mongo:27017/
      MONGO_DB: schedules_db
    depends_on:
      - mongo

  user:
    build: ./user/
    ports:
      - "3004:3004"
    environment:
      MONGO_URI: mongodb://root:example@mongo:27017/
      MONGO_DB: users_db
    depends_on:
      - mongo

  mongo:
    image: mongo
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

volumes:
  mongo_data:
