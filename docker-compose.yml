services:
  movie:
    build: ./movie/
    ports:
      - "3001:3001"

  schedule:
    build: ./schedule/
    ports:
      - "3002:3002"

  booking:
    build: ./booking/
    ports:
      - "3003:3003"
    depends_on:
    - movie
    - schedule
    environment:
    - MOVIE_URL=http://movie:3001
    - SCHEDULE_URL=http://schedule:3002

  user:
    build: ./user/
    ports:
      - "3004:3004"


