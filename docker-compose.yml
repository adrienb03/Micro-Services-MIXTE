services:
  mongo:
    image: mongo:7
    volumes: 
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

  movie:
    build: ./movie/
    ports:
      - "3001:3001"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://root:example@mongo:27017/

  schedule:
    build: ./schedule/
    ports:
      - "3002:3002"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://root:example@mongo:27017/

  booking:
    build: ./booking/
    ports:
      - "3003:3003"
    depends_on:
      - movie
      - schedule
      - mongo
    environment:
      - MOVIE_URL=http://movie:3001
      - SCHEDULE_URL=http://schedule:3002
      - MONGO_URI=mongodb://root:example@mongo:27017/

  user:
    build: ./user/
    ports:
      - "3004:3004"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://root:example@mongo:27017/

volumes:
  mongodb_data: