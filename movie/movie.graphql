type Query {
    get_movies: [Movie]
    movie_with_id(_id: String!): Movie
}

type Mutation {
    add_movie(movie: MovieInput!): Movie
    update_movie_rate(_id: String!, _rate: Float!): Movie
    delete_movie(_id: String!): Movie
}

input MovieInput {
    id: String!
    title: String!
    director: String!
    rating: Float!
}

type Movie {
    id: String!
    title: String!
    director: String!
    rating: Float!
    actors: [Actor]
}

type Actor {
    id: String!
    firstname: String!
    lastname: String!
    birthyear: Int!
    films: [String!]
}