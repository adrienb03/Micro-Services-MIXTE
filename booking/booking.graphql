# Schéma GRAPHQL pour le service Booking

type Query {
    get_bookings: [Booking!]!
    get_booking_by_id(userid: String!): Booking
}

type Mutation {
    add_booking(userid: String!, dates: [BookingDateInput!]!): Booking
    delete_booking(userid: String!): Booking
    delete_movie_from_booking(userid: String!, date: String!, movieid: String!): Booking
}

type Booking {
    userid: String!
    dates: [BookingDate!]!
}

type BookingDate {
    date: String!
    movies: [Movie!]!
}

input BookingDateInput {
    date: String!
    movies: [String!]!
}

type Movie {
    id: String!
    title: String!
    director: String!
    rating: Float!
}
